name: Production Release Build

on:
  release:
    types: [published, created]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: main
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pytest pyinstaller

    - name: Run test suite
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Build executable with PyInstaller
      run: |
        pyinstaller XLTickers.spec
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Create portable ZIP archive
      run: |
        if (Test-Path dist/XLTickers) {
          Compress-Archive -Path dist/XLTickers -DestinationPath dist/XLTickers.zip -Force
        } else {
          Write-Error "Build directory not found"
          exit 1
        }

    - name: Build NSIS installer
      uses: joncloud/makensis-action@v4
      with:
        script-file: installer.nsi

    - name: Upload release artifacts
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        files: |
          dist/XLTickers-Installer.exe
          dist/XLTickers.zip
        tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        prerelease: false
        draft: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
