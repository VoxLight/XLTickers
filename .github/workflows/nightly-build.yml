name: Nightly Build (Development)

on:
  push:
    branches:
      - nightly
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pytest pyinstaller

    - name: Run test suite
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Build executable with PyInstaller
      run: |
        pyinstaller XLTickers.spec
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: Create nightly build artifact
      run: |
        $version = (git describe --tags --always)
        $buildName = "XLTickers-nightly-$version.zip"
        if (Test-Path dist/XLTickers) {
          Compress-Archive -Path dist/XLTickers -DestinationPath $buildName -Force
          echo "BUILD_NAME=$buildName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        } else {
          Write-Error "Build directory not found"
          exit 1
        }

    - name: Upload nightly build artifact
      uses: actions/upload-artifact@v4
      with:
        name: nightly-build-${{ github.run_number }}
        path: XLTickers-nightly-*.zip
        retention-days: 7

    - name: Create/Update nightly release
      uses: softprops/action-gh-release@v1
      if: success()
      with:
        files: XLTickers-nightly-*.zip
        tag_name: nightly
        name: Nightly Build
        prerelease: true
        draft: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
